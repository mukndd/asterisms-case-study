<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Asterisms architecture diagram</title>
  <desc id="desc">A high-level architecture diagram showing source catalogues flowing through a validation pipeline into a generated catalogue, then into a Next.js application and browser gameplay. A separate browser-to-API-to-database path handles scores and leaderboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="58%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M2 2 L9 6 L2 10 Z" fill="#9fb8ff"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="0" fill="url(#bg)"/>
  <g opacity="0.45">
    <circle cx="110" cy="90" r="1.8" fill="#f8fbff"/>
    <circle cx="215" cy="150" r="1.2" fill="#c9d9ff"/>
    <circle cx="380" cy="70" r="1.5" fill="#f8fbff"/>
    <circle cx="940" cy="115" r="1.4" fill="#fff3cf"/>
    <circle cx="1045" cy="245" r="1.1" fill="#f8fbff"/>
    <circle cx="820" cy="590" r="1.5" fill="#c9d9ff"/>
    <circle cx="180" cy="615" r="1.2" fill="#f8fbff"/>
    <circle cx="1080" cy="640" r="1.7" fill="#f8fbff"/>
  </g>

  <text x="70" y="72" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Asterisms System Shape</text>
  <text x="70" y="105" fill="#9aa8c7" font-family="Inter, Arial, sans-serif" font-size="17">Static astronomy catalogue for gameplay, with a small database-backed path for daily scores and leaderboards.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(70 165)">
      <rect width="240" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Astronomy Sources</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">HYG stars, constellation</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">lines, sky-culture data</text>
    </g>
    <g transform="translate(380 165)">
      <rect width="250" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Sync + Build</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">Parse, normalize, join</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">catalogue identifiers</text>
    </g>
    <g transform="translate(700 165)">
      <rect width="240" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Validate</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">Structural checks for</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">patterns, stars, joins</text>
    </g>
    <g transform="translate(380 330)">
      <rect width="250" height="104" rx="10" fill="#17223a" stroke="#6f8df6" filter="url(#glow)"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Generated Catalogue</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">162 patterns, 9,036 stars</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">served as compact data</text>
    </g>
    <g transform="translate(700 330)">
      <rect width="240" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Next.js App</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">Daily, Practice, pattern</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">pages and API routes</text>
    </g>
    <g transform="translate(990 330)">
      <rect width="150" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Browser</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">SVG puzzle</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">Canvas sky</text>
    </g>
    <g transform="translate(700 520)">
      <rect width="240" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Restricted Runtime DB</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">Daily rows, anonymous</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">scores, leaderboards</text>
    </g>
    <g transform="translate(380 520)">
      <rect width="250" height="104" rx="10" fill="#121a2a" stroke="#26324d"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="19" font-weight="700">Server Validation</text>
      <text x="24" y="64" fill="#aebbe0" font-size="14">Plausibility checks before</text>
      <text x="24" y="84" fill="#aebbe0" font-size="14">score persistence</text>
    </g>
  </g>

  <g stroke="#9fb8ff" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.95">
    <path d="M310 217 H380"/>
    <path d="M630 217 H700"/>
    <path d="M820 269 V330"/>
    <path d="M630 382 H700"/>
    <path d="M940 382 H990"/>
    <path d="M990 430 C955 475 935 500 900 520"/>
    <path d="M820 434 V520"/>
    <path d="M700 572 H630"/>
  </g>

  <text x="70" y="685" fill="#7f8cab" font-family="Inter, Arial, sans-serif" font-size="14">Public-safe diagram: no repository links, credentials, account identifiers, hostnames, or internal deployment identifiers.</text>
</svg>
